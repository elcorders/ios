<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>LMS link test</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;padding:16px;background:#f6f7f9;color:#111}
  main{max-width:760px;margin:auto}
  h1{font-size:20px}
  table{width:100%;border-collapse:collapse;background:#fff;margin:8px 0 20px}
  td,th{border:1px solid #ddd;padding:6px 8px;text-align:left;font-size:14px;word-break:break-all}
  th{background:#eef}
  .ok{color:#0a7a2f;font-weight:600}.no{color:#b00020;font-weight:600}
  pre{background:#fff;border:1px solid #ddd;padding:8px;white-space:pre-wrap;word-break:break-all}
  button{padding:8px 14px;font-size:14px}
  .note{font-size:13px;color:#555}
</style>
</head>
<body>
<main>
<h1>LMS link test</h1>
<p class="note">Nothing on this page is sent anywhere. It only shows what the LMS put in the link. Close the tab when done.</p>

<h2>Expected parameters</h2>
<table id="exp"><tr><th>Parameter</th><th>Found in</th><th>Value</th></tr></table>

<h2>Raw</h2>
<table id="raw"></table>

<button id="copy">Copy result (values masked)</button>
<pre id="out"></pre>
</main>
<script>
const expected=["k","c","username","idnumber","email","first","last","course","mobile","phone","dept","cmid"];
const q=new URLSearchParams(location.search);
const h=location.hash||"";
const hq=new URLSearchParams(h.includes("?")?h.slice(h.indexOf("?")+1):"");
const mask=v=>v==null?"":v===""?"(empty)":(v.length<=4?"****":v.slice(0,2)+"…"+v.slice(-2)+" ("+v.length+" chars)");
const exp=document.getElementById("exp");
const rows=[];
for(const p of expected){
  const inQ=q.get(p), inH=hq.get(p);
  const where=inH!=null&&inQ!=null?"both":inH!=null?"after #":inQ!=null?"query (before #)":"missing";
  const val=inH??inQ;
  const tr=exp.insertRow();
  tr.insertCell().textContent=p;
  const c=tr.insertCell(); c.textContent=where; c.className=where==="missing"?"no":"ok";
  tr.insertCell().textContent=val??"";
  rows.push(p+": "+where+(val!=null?" = "+mask(val):""));
}
const raw=document.getElementById("raw");
const add=(k,v)=>{const tr=raw.insertRow();tr.insertCell().textContent=k;tr.insertCell().textContent=v;};
add("pathname",location.pathname); add("search (sent to server)",location.search||"(empty)"); add("hash (stays in browser)",h||"(empty)");
const out=document.getElementById("out");
const summary=["path: "+location.pathname,"query present: "+(location.search?"yes":"no"),"hash present: "+(h?"yes":"no"),...rows].join("\n");
out.textContent=summary;
document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(summary).then(()=>{document.getElementById("copy").textContent="Copied";});
</script>
</body>
</html>
