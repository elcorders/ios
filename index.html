<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NIBM iOS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>NIBM iOS</title>
    <script>
      // Apply the saved theme before first paint (dark is the default). Mirrors src/lib/theme.ts.
      try {
        if (localStorage.getItem('ios.theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', '#f5f6fa'); });
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
